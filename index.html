<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assure Tow Lobby</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lobby">
      <section class="slideshow" aria-label="Assure Tow Lobby Slides">
        <div
          class="slide is-active"
          data-side="right"
          style="background-image: url('assets/Dispatch.jpg')"
        >
          <div class="overlay overlay--right">
            <h1>Centralized Dispatch Control</h1>
            <p>Review and assign tow jobs in seconds.</p>
          </div>
        </div>
        <div
          class="slide"
          data-side="right"
          style="background-image: url('assets/driver-access.jpg')"
        >
          <div class="overlay overlay--right">
            <h1>Driver Mobile Access</h1>
            <p>Everything drivers need, right on their phone.</p>
          </div>
        </div>
        <div
          class="slide"
          data-side="right"
          style="background-image: url('assets/Signing.png')"
        >
          <div class="overlay overlay--right">
            <h1>Digital Signatures</h1>
            <p>Capture authorization instantly, no paperwork.</p>
          </div>
        </div>
        <div
          class="slide"
          data-side="left"
          style="background-image: url('assets/Driver-and-customer.jpg')"
        >
          <div class="overlay overlay--left">
            <h1>Clear Customer Hand-Offs</h1>
            <p>Professional interactions from start to finish.</p>
          </div>
        </div>
      </section>
      <div class="login-wrap">
        <a class="login-button" href="https://app.assuretow.com">Log In</a>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
